services:
  # -------------------------------------------------------------
  # Single Unified Web Service (Vite React Client + Express Backend)
  # -------------------------------------------------------------
  - type: web
    name: ecosphere-client
    runtime: node
    plan: free
    region: oregon
    rootDir: VerdantIQReactClient
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: VerdantIQ
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
