previews:
  generation: automatic

services:
  # ---------------------------------------------------------------------------
  # 1. ML Gateway (FastAPI Python Microservice)
  # ---------------------------------------------------------------------------
  - type: web
    name: verdantiq-ml-gateway
    plan: free
    runtime: python
    repo: https://github.com/TheOrionGD/VERDENTIQ-ECHOSPHERE.git
    branch: theoriongd
    rootDir: VerdantIQServices/ml-gateway
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: INTERNAL_SERVICE_KEY
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. Spring Boot API Gateway (Java 17 Microservice)
  # ---------------------------------------------------------------------------
  - type: web
    name: verdantiq-sb-gateway
    plan: free
    runtime: docker
    repo: https://github.com/TheOrionGD/VERDENTIQ-ECHOSPHERE.git
    branch: theoriongd
    rootDir: VerdantIQServices/sb-gateway
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: verdantiq-ml-gateway
          property: host
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: verdantiq-ml-gateway
          envVarKey: INTERNAL_SERVICE_KEY
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - fromGroup: verdantiq-shared-env

  # ---------------------------------------------------------------------------
  # 3. Frontend Client (Next.js 15 Web Application)
  # ---------------------------------------------------------------------------
  - type: web
    name: verdantiq-client
    plan: free
    runtime: node
    repo: https://github.com/TheOrionGD/VERDENTIQ-ECHOSPHERE.git
    branch: theoriongd
    rootDir: VerdantIQCLIENT
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_GATEWAY_URL
        fromService:
          type: web
          name: verdantiq-sb-gateway
          property: host
      - key: NEXT_PUBLIC_ENABLE_DEV_ROLE_SWITCHER
        value: "true"
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: verdantiq-ml-gateway
          envVarKey: INTERNAL_SERVICE_KEY
      - fromGroup: verdantiq-shared-env

envVarGroups:
  - name: verdantiq-shared-env
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: VerdantIQ
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: godfrey.cs23@krct.ac.in
      - key: BREVO_SENDER_NAME
        value: VerdantIQ Verification System
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
