[project]
name = "ml-gateway"
version = "0.1.0"
description = "VerdantIQ FastAPI ML Service for ML Ops and OCR"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "ortools>=9.7.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
