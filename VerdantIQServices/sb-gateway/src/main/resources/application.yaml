server:
  port: 8080

spring:
  application:
    name: verdantiq-gateway
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB_NAME:VerdantIQ}
      auto-index-creation: true

verdantiq:
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  internal-service-key: ${INTERNAL_SERVICE_KEY}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-admin-key.json}
